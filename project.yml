# XcodeGen spec. `make project` generates VoxLook.xcodeproj (git-ignored) from it.
name: VoxLook
options:
  bundleIdPrefix: co.springfolk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  VoxLook:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  VoxLook:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: VoxLook
        product: VoxRender
      - target: VoxLookPreview
      - target: VoxLookThumbnail
      - target: VoxLookSpotlight
        copy:
          destination: wrapper
          subpath: Contents/Library/Spotlight
    entitlements:
      path: Config/Sandbox.entitlements
      properties: &sandbox
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.springfolk.voxlook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VoxLook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "MIT License"
        CFBundleDocumentTypes:
          - CFBundleTypeName: MagicaVoxel Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: VoxDocument
            LSItemContentTypes: [com.ephtracy.vox]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ephtracy.vox
            UTTypeDescription: MagicaVoxel Model
            UTTypeConformsTo: [public.data]  # not public.3d-content: Apple's SceneKit thumbnailer would claim it
            UTTypeReferenceURL: https://ephtracy.github.io
            UTTypeIconFile: VoxDocument  # else Finder shows "?" or a generic audio icon (.vox is also Dialogic audio)
            UTTypeTagSpecification:
              public.filename-extension: [vox]

  VoxLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - PreviewExtension
    dependencies:
      - package: VoxLook
        product: VoxRender
      - sdk: Quartz.framework
    entitlements:
      path: Config/Sandbox.entitlements
      properties: *sandbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.springfolk.voxlook.preview
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: VoxLook Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.ephtracy.vox]
            QLSupportsSearchableItems: false

  VoxLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - ThumbnailExtension
    dependencies:
      - package: VoxLook
        product: VoxRender
      - sdk: QuickLookThumbnailing.framework
    entitlements:
      path: Config/Sandbox.entitlements
      properties: *sandbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.springfolk.voxlook.thumbnail
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: VoxLook Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.ephtracy.vox]
            QLThumbnailMinimumDimension: 16

  # Classic Spotlight importer: macOS ignores CSImportExtension.
  VoxLookSpotlight:
    type: bundle
    platform: macOS
    sources:
      - SpotlightImporter
    dependencies:
      - package: VoxLook
        product: VoxKit
    settings:
      base:
        PRODUCT_NAME: VoxLook
        PRODUCT_MODULE_NAME: VoxLookSpotlight
        PRODUCT_BUNDLE_IDENTIFIER: co.springfolk.voxlook.spotlight
        WRAPPER_EXTENSION: mdimporter
        INSTALL_PATH: /Library/Spotlight
        SKIP_INSTALL: YES
    info:
      path: SpotlightImporter/Info.plist
      properties:
        CFBundleDisplayName: VoxLook Spotlight
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeRole: MDImporter
            LSItemContentTypes: [com.ephtracy.vox]
        CFPlugInDynamicRegistration: "NO"
        CFPlugInFactories:
          4B519B9F-BA7B-44CE-8AFE-E064CF56F6B6: VoxLookImporterFactory
        CFPlugInTypes:
          8B08C4BF-415B-11D8-B3F9-0003936726FC: [4B519B9F-BA7B-44CE-8AFE-E064CF56F6B6]  # kMDImporterTypeID
