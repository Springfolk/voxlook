name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project VoxLook.xcodeproj -scheme VoxLook -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
