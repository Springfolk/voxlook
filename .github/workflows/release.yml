name: Release

# Builds the universal, ad-hoc signed VoxLook.zip that install.sh downloads,
# and attaches it to the GitHub release for the pushed tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build
        run: |
          brew install xcodegen
          make dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v tag="${GITHUB_REF_NAME#v}" '$0 ~ "^## "tag {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "VoxLook ${GITHUB_REF_NAME#v}" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" build/VoxLook.zip --clobber
